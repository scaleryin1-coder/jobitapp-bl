<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Clean white background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#E2E8F0" stroke-width="12"/>

  <!-- Centered JOBit Icon Mark: Pin with orbit and typography -->
  <g transform="translate(6, 12)">
    <!-- Red Location Pin with Navy Orbit Ring -->
    <g transform="translate(195, 160)">
      <ellipse cx="20" cy="40" rx="95" ry="42" fill="none" stroke="#0B2559" stroke-width="22" transform="rotate(-26 20 40)" />
      <path d="M 20 -40 C -25 -40 -60 -5 -60 40 C -60 85 20 155 20 155 C 20 155 100 85 100 40 C 100 -5 65 -40 20 -40 Z" fill="#E50914" />
      <circle cx="20" cy="35" r="28" fill="#FFFFFF" />
    </g>

    <!-- Wordmark JOB (Navy) it (Red) -->
    <text x="250" y="390" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="96" letter-spacing="-2">
      <tspan fill="#0B2559">JOB</tspan><tspan fill="#E50914">it</tspan>
    </text>
  </g>
</svg>
