<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Clean white background rounded icon base -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#E2E8F0" stroke-width="12"/>

  <!-- Top Vibrant Deep Red Pin -->
  <g transform="translate(256, 120)">
    <path d="M0 -65 C-36 -65 -65 -36 -65 -4 C-65 40 0 88 0 88 C0 88 65 40 65 -4 C65 -36 36 -65 0 -65 Z" fill="#D32F2F" />
    <circle cx="0" cy="-10" r="22" fill="#FFFFFF" />
  </g>

  <!-- Navy Blue Squared Icon Block -->
  <rect x="166" y="210" width="180" height="180" rx="36" fill="#0B172E"/>

  <!-- Inside Icons (White vector shapes) -->
  <!-- Hand gripping styled spanner -->
  <g transform="translate(256, 260)">
    <path d="M-30 -16 C-27 -23 -19 -25 -13 -20 L-5 -13 L14 -26 C19 -29 27 -27 30 -22 C33 -17 31 -9 25 -6 L7 8 L14 16 C17 21 15 28 8 31 C2 33 -5 31 -9 26 Z" fill="#FFFFFF" />
    <circle cx="0" cy="5" r="10" fill="#0B172E" />
  </g>

  <!-- Ladder & Droplet & House accents -->
  <g transform="translate(200, 310)">
    <line x1="-8" y1="-32" x2="-8" y2="34" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="-32" x2="8" y2="34" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="-8" y1="-20" x2="8" y2="-20" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-8" y1="-5" x2="8" y2="-5" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-8" y1="10" x2="8" y2="10" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-8" y1="25" x2="8" y2="25" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <g transform="translate(305, 312)">
    <!-- Droplet -->
    <path d="M0 -22 C-14 -7 -14 5 0 15 C14 5 14 -7 0 -22 Z" fill="#FFFFFF" />
    <!-- Lightning bolt -->
    <path d="M-12 18 L-20 32 L-14 32 L-18 42 L-7 30 L-12 30 Z" fill="#FFFFFF" />
  </g>

  <!-- Bottom Brand Text Accent -->
  <text x="256" y="455" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="52">
    <tspan fill="#D32F2F">JOB</tspan><tspan fill="#0B172E">it</tspan>
  </text>
</svg>
