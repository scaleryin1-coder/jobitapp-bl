<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <!-- Clean solid white canvas background -->
  <rect width="1100" height="520" fill="#FFFFFF" />

  <g id="brand-logo" transform="translate(60, 40)">
    
    <!-- Wordmark JOB: Deep Navy Blue (#0B2559) -->
    <!-- 'J' -->
    <path d="M 120 70 L 195 70 L 195 240 C 195 320 145 355 60 355 C 20 355 -15 342 -30 328 L -5 268 C 10 278 30 288 60 288 C 100 288 120 270 120 230 Z" fill="#0B2559" />
    
    <!-- 'O' -->
    <path d="M 330 65 C 425 65 490 135 490 230 C 490 325 425 395 330 395 C 235 395 170 325 170 230 C 170 135 235 65 330 65 Z M 330 135 C 275 135 245 175 245 230 C 245 285 275 325 330 325 C 385 325 415 285 415 230 C 415 175 385 135 330 135 Z" fill="#0B2559" />

    <!-- 'B' -->
    <path d="M 505 70 L 610 70 C 665 70 705 95 705 145 C 705 180 680 205 645 218 C 695 230 725 260 725 315 C 725 370 675 395 605 395 L 505 395 Z M 578 135 L 578 195 L 605 195 C 630 195 645 185 645 165 C 645 145 630 135 605 135 Z M 578 260 L 578 330 L 610 330 C 640 330 658 318 658 295 C 658 272 640 260 610 260 Z" fill="#0B2559" />

    <!-- Wordmark 'it': Bright Red (#E50914) -->
    <!-- 'i' dot -->
    <circle cx="790" cy="95" r="42" fill="#E50914" />
    <!-- 'i' stem -->
    <rect x="755" y="160" width="70" height="235" rx="14" fill="#E50914" />

    <!-- 't' -->
    <path d="M 855 205 L 905 205 L 905 160 L 975 160 L 975 205 L 1030 205 L 1030 260 L 975 260 L 975 340 C 975 365 985 375 1010 375 C 1020 375 1030 372 1038 368 L 1045 425 C 1030 435 1005 440 970 440 C 915 440 885 410 885 350 L 885 260 L 855 260 Z" fill="#E50914" />

    <!-- Red Location Pin below J & O -->
    <g transform="translate(195, 290)">
      <!-- Navy Blue Orbit Ring -->
      <ellipse cx="20" cy="40" rx="95" ry="42" fill="none" stroke="#0B2559" stroke-width="22" transform="rotate(-26 20 40)" />
      <!-- Red Pin Body -->
      <path d="M 20 -40 C -25 -40 -60 -5 -60 40 C -60 85 20 155 20 155 C 20 155 100 85 100 40 C 100 -5 65 -40 20 -40 Z" fill="#E50914" />
      <!-- White Center Circle -->
      <circle cx="20" cy="35" r="28" fill="#FFFFFF" />
    </g>

    <!-- Tagline: Reliable Service Partner -->
    <text x="735" y="445" text-anchor="middle" font-family="'Outfit', 'Montserrat', -apple-system, sans-serif" font-weight="700" font-size="34" fill="#0B2559" letter-spacing="0.5">
      Reliable Service Partner
    </text>

  </g>
</svg>
